name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The frontend is built by its own job; python jobs reuse or skip the bundle.
  MUPSTUDIO_SKIP_FRONTEND_BUILD: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec prettier --check "src/**/*.{ts,tsx,css}"
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend typecheck

  test-backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.11", "3.13"]
        # Keep PRs quick: the full OS x python spread runs on main and nightly.
        exclude:
          - os: macos-14
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q --cov=mupstudio --cov-report=term-missing

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test --run

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Build the real bundle here; the hook only copies it into the wheel.
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: cp -r frontend/dist src/mupstudio/_static

      - run: uv build

      - name: assert the wheel carries the frontend
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          unzip -l "$wheel" | grep -q 'mupstudio/_static/index.html'
          unzip -l "$wheel" | grep -qE 'mupstudio/_static/assets/.*\.js'
          echo "bundle present in $wheel"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  install-smoke:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the wheel and smoke-test the CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          mupstudio version
          mupstudio doctor || true   # engines are absent here; warnings are expected
          mupstudio serve --check
