name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The frontend is built by its own job; python jobs reuse or skip the bundle.
  MUPSTUDIO_SKIP_FRONTEND_BUILD: "1"

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec prettier --check "src/**/*.{ts,tsx,css}"
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend typecheck

  test-backend:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.11", "3.13"]
        # Keep PRs quick: the full OS x python spread runs on main and nightly.
        exclude:
          - os: macos-14
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q --cov=mupstudio --cov-report=term-missing

  test-frontend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test --run

  # The M1 gate. macos runners have a real GPU; ubuntu would fall back to
  # SwiftShader and measure nothing useful, so this is macOS only. Advisory for
  # now: it reports numbers and fails on a large regression, but the
  # authoritative check is `just perf` on a dev machine (see docs/perf-baseline.md).
  perf:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: macos-14
    continue-on-error: true
    # This job starts two servers and drives a browser, so every part of it can
    # hang rather than fail. It has, for half an hour at a time, on a runner
    # billed at ten times the linux rate — and because it is advisory the run
    # never went red, it just never finished.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: uv sync
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install chromium

      - name: run the frame-time harness
        run: |
          set -euo pipefail
          uv run uvicorn mupstudio.server.app:create_app --factory --port 8000 > /tmp/api.log 2>&1 &
          pnpm --dir frontend dev --port 5173 > /tmp/vite.log 2>&1 &

          # http-get:// because wait-on probes with HEAD by default, and
          # FastAPI does not answer HEAD on a route declared for GET — so the
          # health check came back 405 and wait-on kept waiting for a server
          # that was already up. The timeout is the backstop for one that is
          # genuinely not, and the logs below say which.
          if ! npx wait-on --timeout 120000 \
              http-get://127.0.0.1:8000/api/v1/health http-get://localhost:5173; then
            echo "--- api ---"; cat /tmp/api.log
            echo "--- vite ---"; cat /tmp/vite.log
            exit 1
          fi

          # --budget-ms because this is a shared virtual machine, not the
          # M-series Mac the 8.33 ms gate describes. The strict number is the
          # default and is what `just perf` checks; see docs/perf-baseline.md.
          node frontend/scripts/perf.mjs --url http://localhost:5173 \
            --ncpl 50000 --nlay 10 --frames 200 --channel chromium --budget-ms 25
        env:
          MUPSTUDIO_DEV: "1"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: uv sync
      - run: pnpm --dir frontend install --frozen-lockfile

      # Against the packaged app, not the dev server: the bundle being missing
      # or stale is one of the things these tests exist to catch.
      - run: pnpm --dir frontend build
      - run: cp -r frontend/dist src/mupstudio/_static
      - run: pnpm --dir frontend exec playwright install --with-deps chromium

      - run: pnpm --dir frontend e2e
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: frontend/test-results/
          retention-days: 7

  wheel:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Build the real bundle here; the hook only copies it into the artifacts.
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: cp -r frontend/dist src/mupstudio/_static

      # Built separately rather than with a bare `uv build`, which builds the
      # wheel from the sdist it just made. Each artifact is then one step with
      # one thing that can go wrong, and the sdist-to-wheel path is tested
      # below where that is the thing under test.
      - run: uv build --sdist
      - run: uv build --wheel

      - name: assert both artifacts carry the frontend
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)

          # Listed to files rather than piped into grep: `grep -q` exits on the
          # first match, and under `pipefail` the SIGPIPE that gives the writer
          # fails the step even when the file was found.
          unzip -l "$wheel" > /tmp/wheel.txt
          tar tzf "$sdist" > /tmp/sdist.txt

          missing=0
          check() {  # pattern, file, what
            grep -qE "$1" "$2" || { echo "MISSING from $3: $1"; missing=1; }
          }
          check 'mupstudio/_static/index.html' /tmp/wheel.txt "the wheel"
          check 'mupstudio/_static/assets/.*\.js' /tmp/wheel.txt "the wheel"
          # The sdist has to carry it too, or `pip install --no-binary` runs pnpm.
          check 'src/mupstudio/_static/index.html' /tmp/sdist.txt "the sdist"

          if [ "$missing" = 1 ]; then
            echo "--- _static entries in the wheel ---"
            grep '_static' /tmp/wheel.txt || echo "(none)"
            echo "--- _static entries in the sdist ---"
            grep '_static' /tmp/sdist.txt || echo "(none)"
            echo "--- what was on disk when they were built ---"
            ls -la src/mupstudio/_static || echo "(_static absent)"
            exit 1
          fi
          echo "bundle present in $wheel and $sdist"

      - name: a wheel builds from the sdist with no node installed
        run: |
          set -euo pipefail
          # The guarantee behind `pip install mupstudio` on a machine that has
          # only Python: unpack the sdist, hide every node tool, build a wheel.
          # If this needs pnpm, so does every user, and they will not have it.
          mkdir -p /tmp/nonode && ln -sf "$(command -v uv)" /tmp/nonode/uv
          rm -rf /tmp/unpacked && mkdir -p /tmp/unpacked
          tar xzf dist/*.tar.gz -C /tmp/unpacked
          cd /tmp/unpacked/mupstudio-*
          env -u MUPSTUDIO_SKIP_FRONTEND_BUILD PATH=/tmp/nonode:/usr/bin:/bin HOME="$HOME" \
            /tmp/nonode/uv build --wheel --out-dir /tmp/fromsdist .
          unzip -l /tmp/fromsdist/*.whl > /tmp/fromsdist.txt
          grep -q 'mupstudio/_static/index.html' /tmp/fromsdist.txt
          echo "sdist builds a complete wheel without node"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  install-smoke:
    timeout-minutes: 15
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the wheel and smoke-test the CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          mupstudio version
          mupstudio doctor || true   # engines are absent here; warnings are expected
          mupstudio serve --check
