name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The frontend is built by its own job; python jobs reuse or skip the bundle.
  MUPSTUDIO_SKIP_FRONTEND_BUILD: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec prettier --check "src/**/*.{ts,tsx,css}"
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend typecheck

  test-backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.11", "3.13"]
        # Keep PRs quick: the full OS x python spread runs on main and nightly.
        exclude:
          - os: macos-14
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q --cov=mupstudio --cov-report=term-missing

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test --run

  # The M1 gate. macos runners have a real GPU; ubuntu would fall back to
  # SwiftShader and measure nothing useful, so this is macOS only. Advisory for
  # now: it reports numbers and fails on a large regression, but the
  # authoritative check is `just perf` on a dev machine (see docs/perf-baseline.md).
  perf:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: uv sync
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install chromium

      - name: run the frame-time harness
        run: |
          set -euo pipefail
          uv run uvicorn mupstudio.server.app:create_app --factory --port 8000 &
          pnpm --dir frontend dev --port 5173 &
          npx wait-on http://127.0.0.1:8000/api/v1/health http://localhost:5173
          node frontend/scripts/perf.mjs --url http://localhost:5173 \
            --ncpl 50000 --nlay 10 --frames 200 --channel chromium
        env:
          MUPSTUDIO_DEV: "1"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Build the real bundle here; the hook only copies it into the wheel.
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: cp -r frontend/dist src/mupstudio/_static

      - run: uv build

      - name: assert both artifacts carry the frontend
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          unzip -l "$wheel" | grep -q 'mupstudio/_static/index.html'
          unzip -l "$wheel" | grep -qE 'mupstudio/_static/assets/.*\.js'
          echo "bundle present in $wheel"

          # The sdist has to carry it too. `uv build` and `pip install .` build
          # the wheel from the sdist, so a sdist without the bundle either
          # produces a wheel without one or forces pnpm to run at install time.
          sdist=$(ls dist/*.tar.gz)
          tar tzf "$sdist" | grep -q 'src/mupstudio/_static/index.html'
          echo "bundle present in $sdist"

      - name: a wheel builds from the sdist with no node installed
        run: |
          set -euo pipefail
          # The guarantee behind `pip install mupstudio` on a machine that has
          # only Python: unpack the sdist, hide every node tool, build a wheel.
          # If this needs pnpm, so does every user, and they will not have it.
          mkdir -p /tmp/nonode && ln -sf "$(command -v uv)" /tmp/nonode/uv
          rm -rf /tmp/unpacked && mkdir -p /tmp/unpacked
          tar xzf dist/*.tar.gz -C /tmp/unpacked
          cd /tmp/unpacked/mupstudio-*
          env -u MUPSTUDIO_SKIP_FRONTEND_BUILD PATH=/tmp/nonode:/usr/bin:/bin HOME="$HOME" \
            /tmp/nonode/uv build --wheel --out-dir /tmp/fromsdist .
          unzip -l /tmp/fromsdist/*.whl | grep -q 'mupstudio/_static/index.html'
          echo "sdist builds a complete wheel without node"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  install-smoke:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the wheel and smoke-test the CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          mupstudio version
          mupstudio doctor || true   # engines are absent here; warnings are expected
          mupstudio serve --check
